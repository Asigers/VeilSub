<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VeilSub</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 300px; margin: 0; padding: 16px; color: #111827; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0 0 14px; color: #6b7280; }
    label { display:block; font-size:12px; margin:10px 0 4px; color:#4b5563; }
    input, select {
      box-sizing:border-box;
      width:100%;
      padding:8px;
      border:1px solid #d1d5db;
      border-radius:8px;
      background:#fff;
      color:#111827;
    }
    input[type="range"] { padding:0; border:0; }
    .range-label { display:flex; justify-content:space-between; align-items:center; }
    .range-label span { color:#6b7280; font-variant-numeric:tabular-nums; }
    .row { display:flex; gap:8px; margin-top:14px; }
    button { flex:1; padding:9px 10px; border:0; border-radius:8px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    #start { background:#111827; color:white; }
    #stop { background:#f3f4f6; color:#111827; }
    #status { margin-top:10px; font-size:12px; color:#6b7280; min-height:16px; }
    #shortcut { margin-top:8px; font-size:11px; color:#9ca3af; }
    #metrics {
      display:none;
      margin-top:12px;
      padding-top:10px;
      border-top:1px solid #e5e7eb;
      font-size:11px;
      color:#6b7280;
      line-height:1.55;
    }
    #metrics strong { color:#374151; font-weight:600; }
    details { margin-top:12px; }
    summary { cursor:pointer; font-size:12px; color:#4b5563; }
  </style>
</head>
<body>
  <h1>VeilSub</h1>
  <p>Live subtitles for the current tab.</p>

  <label for="gateway">Gateway</label>
  <input id="gateway" value="ws://127.0.0.1:8000/v1/live" />

  <label for="source">Source language</label>
  <input id="source" value="ja-JP" />

  <label for="target">Target language</label>
  <input id="target" value="zh-CN" />

  <label for="displayMode">Display</label>
  <select id="displayMode">
    <option value="bilingual">Bilingual</option>
    <option value="translation">Translation only</option>
    <option value="source">Source only</option>
  </select>

  <details>
    <summary>Subtitle appearance</summary>

    <label class="range-label" for="fontSize">
      <span>Font size</span><span id="fontSizeValue"></span>
    </label>
    <input id="fontSize" type="range" min="14" max="36" step="1" value="21" />

    <label class="range-label" for="verticalPosition">
      <span>Position from bottom</span><span id="verticalPositionValue"></span>
    </label>
    <input id="verticalPosition" type="range" min="3" max="40" step="1" value="9" />

    <label class="range-label" for="backgroundOpacity">
      <span>Background</span><span id="backgroundOpacityValue"></span>
    </label>
    <input id="backgroundOpacity" type="range" min="20" max="95" step="5" value="72" />

    <label class="range-label" for="subtitleDelayMs">
      <span>Display delay</span><span id="subtitleDelayMsValue"></span>
    </label>
    <input id="subtitleDelayMs" type="range" min="0" max="3000" step="100" value="0" />
  </details>

  <div class="row">
    <button id="start">Start subtitles</button>
    <button id="stop">Stop</button>
  </div>

  <div id="status"></div>
  <div id="shortcut">Shortcut: Ctrl+Shift+Y · macOS: ⌘⇧Y</div>
  <div id="metrics"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
