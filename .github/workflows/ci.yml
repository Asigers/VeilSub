name: ci

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node -e "JSON.parse(require('fs').readFileSync('apps/extension/manifest.json', 'utf8'))"
          node --check apps/extension/src/background.js
          node --check apps/extension/src/offscreen.js
          node --check apps/extension/src/content.js
          node --check apps/extension/src/popup.js
          node --check apps/extension/src/pcm-worklet.js
      - run: node --test apps/extension/tests/*.test.cjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p apps/android :app:testDebugUnitTest :app:assembleDebug --stacktrace
